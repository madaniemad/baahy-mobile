name: baahy_customer
description: baahy — Libya's marketplace. Customer app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.3

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Firebase / Push
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.1.2

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  camera: ^0.11.0

  # Thin variable-weight icons for nav bar
  material_symbols_icons: ^4.2719.1

  # UI & UX
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Connectivity & network awareness
  connectivity_plus: ^7.1.1

  # firebase_crashlytics: ^4.1.0  # Re-enable after adding google-services.json

  # Location
  geolocator: ^12.0.0
  http: ^1.2.2

  # Social / QR
  qr_flutter: ^4.1.0
  app_links: ^6.3.4

  # File storage (PDF invoice download)
  path_provider: ^2.1.4

  # Error monitoring
  sentry_flutter: ^8.9.0

  # Utilities
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  google_maps_flutter: ^2.5.0
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
