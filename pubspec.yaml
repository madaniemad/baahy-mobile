name: baahy_customer
description: baahy — Libya's marketplace. Customer app.
publish_to: 'none'
version: 5.0.1+138

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.3

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Firebase / Push
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^17.1.2

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  camera: ^0.11.0

  # Thin variable-weight icons for nav bar

  # UI & UX
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Connectivity & network awareness
  connectivity_plus: ^7.1.1

  # firebase_crashlytics: ^4.1.0  # Re-enable after adding google-services.json

  # Location
  geolocator: ^12.0.0
  http: ^1.2.2

  # Vector graphics (onboarding stylized coast map)
  flutter_svg: ^2.0.10+1

  # Social / QR
  qr_flutter: ^4.1.0
  app_links: ^6.3.4
  webview_flutter: ^4.10.0

  # File storage (PDF invoice download)
  path_provider: ^2.1.4

  # Error monitoring
  sentry_flutter: ^8.9.0

  # Utilities
  url_launcher: ^6.2.6
  share_plus: ^12.0.0
  package_info_plus: ^8.0.0
  google_maps_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icons. Source art is the LIVE store icon (teal square, white "b")
# so the update keeps the same icon users already have.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true          # App Store rejects icons with an alpha channel
  android: "ic_launcher"
  adaptive_icon_background: "#30EADF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/payment/
    - assets/icons/
    - assets/onboarding/
    - assets/onboarding/heroes/
    - assets/onboarding/full/

  fonts:
    # Bottom-nav icons — 5 glyphs subset from Material Symbols Outlined
    # (10 MB -> 14 KB). See lib/shared/widgets/nav_icons.dart.
    - family: BaahyNavIcons
      fonts:
        - asset: assets/fonts/BaahyNavIcons.ttf
    # English / Latin — Manrope (variable font, wght axis)
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VF.ttf
          weight: 400
        - asset: assets/fonts/Manrope-VF.ttf
          weight: 500
        - asset: assets/fonts/Manrope-VF.ttf
          weight: 600
        - asset: assets/fonts/Manrope-VF.ttf
          weight: 700
        - asset: assets/fonts/Manrope-VF.ttf
          weight: 800
    # Arabic — Tajawal (used as fallback for Arabic glyphs)
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
